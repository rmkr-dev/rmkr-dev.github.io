<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Debugger | Ramkumar's Toolkit</title>
  <meta name="description" content="Decode JWT header and payload locally in the browser.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/site.js" defer></script>
  <style>
    .jwt-panels { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 900px) {
      .jwt-panels { grid-template-columns: 2fr 1fr; }
      .jwt-out { grid-template-columns: 1fr 1fr; }
    }
    .jwt-out { display: grid; gap: 1rem; margin-top: 1rem; }
    .jwt-card {
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: 16px;
      padding: 1rem 1.25rem;
    }
    .jwt-card h3 {
      margin: 0 0 0.75rem;
      color: var(--color-accent);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .jwt-card pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      color: var(--color-text);
      max-height: 28rem;
      overflow: auto;
    }
    .jwt-header-tone { color: #fb7185; }
    .jwt-payload-tone { color: #38bdf8; }
  </style>
</head>
<body data-root="../" data-tool="jwt">
<main class="wrap page-main" id="main">
  <h1 class="page-title">JWT Debugger</h1>
  <p class="page-lead">Decode header and payload locally. Optional JWKS lookup checks whether the token <code>kid</code> appears in a published key set (not a full cryptographic verify).</p>

  <div class="jwt-panels">
    <div>
      <label for="jwt-input">Encoded token</label>
      <textarea id="jwt-input" spellcheck="false" placeholder="Paste your JWT here..." rows="10"></textarea>
    </div>
    <div>
      <label for="jwks-url">JWKS URL (optional)</label>
      <input id="jwks-url" type="url" placeholder="https://example.com/.well-known/jwks.json">
      <div class="toolbar" style="margin-top:0.75rem;">
        <button class="btn btn-gold" type="button" id="verify">Check kid in JWKS</button>
        <button class="btn btn-ghost" type="button" id="clear">Clear</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </div>

  <div class="jwt-out">
    <div class="jwt-card">
      <h3>
        <span>Header</span>
        <button class="btn btn-ghost" type="button" id="dl-header" style="padding:0.35rem 0.7rem;font-size:0.75rem;">Download</button>
      </h3>
      <pre id="jwt-header" class="jwt-header-tone">{}</pre>
    </div>
    <div class="jwt-card">
      <h3>
        <span>Payload</span>
        <button class="btn btn-ghost" type="button" id="dl-payload" style="padding:0.35rem 0.7rem;font-size:0.75rem;">Download</button>
      </h3>
      <pre id="jwt-payload" class="jwt-payload-tone">{}</pre>
    </div>
  </div>
</main>
<script>
(function () {
  const input = document.getElementById('jwt-input');
  const headerView = document.getElementById('jwt-header');
  const payloadView = document.getElementById('jwt-payload');
  const status = document.getElementById('status');
  const jwksUrl = document.getElementById('jwks-url');

  function show(msg, kind) {
    if (window.RMKR && RMKR.setStatus) RMKR.setStatus(status, msg || '', kind || '');
    else { status.textContent = msg || ''; status.className = 'status' + (kind ? ' ' + kind : ''); }
  }

  function b64urlToJson(part) {
    const padded = part.replace(/-/g, '+').replace(/_/g, '/');
    const pad = padded + '==='.slice((padded.length + 3) % 4);
    const decoded = decodeURIComponent(atob(pad).split('').map(function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(decoded);
  }

  function updateView() {
    const token = input.value.trim();
    if (!token) {
      headerView.textContent = '{}';
      payloadView.textContent = '{}';
      show('');
      return;
    }
    const parts = token.split('.');
    if (parts.length < 2) {
      headerView.textContent = 'Invalid token';
      payloadView.textContent = 'Invalid token';
      show('Token needs at least header and payload segments.', 'err');
      return;
    }
    try {
      headerView.textContent = JSON.stringify(b64urlToJson(parts[0]), null, 2);
      payloadView.textContent = JSON.stringify(b64urlToJson(parts[1]), null, 2);
      show('Decoded locally.', 'ok');
    } catch (e) {
      headerView.textContent = 'Invalid header';
      payloadView.textContent = 'Invalid payload';
      show(e.message || 'Could not decode token.', 'err');
    }
  }

  function download(kind) {
    const content = kind === 'header' ? headerView.textContent : payloadView.textContent;
    if (!content || content === '{}' || content.indexOf('Invalid') === 0) {
      show('Nothing to download yet.', 'err');
      return;
    }
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'jwt-' + kind + '.json';
    a.click();
    URL.revokeObjectURL(url);
    show('Downloaded ' + kind + '.', 'ok');
  }

  async function verifyKid() {
    const url = jwksUrl.value.trim();
    const token = input.value.trim();
    if (!url || !token) {
      show('Provide both a JWT and a JWKS URL.', 'err');
      return;
    }
    show('Fetching JWKS…');
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('JWKS request failed (' + response.status + ').');
      const keys = await response.json();
      if (!keys || !Array.isArray(keys.keys)) throw new Error('Response is not a JWKS document.');
      const header = JSON.parse(headerView.textContent);
      if (!header.kid) {
        show('Decoded header has no kid claim to match.', 'err');
        return;
      }
      const match = keys.keys.find(function (k) { return k.kid === header.kid; });
      if (match) show('kid matched a key in the JWKS set (existence check only).', 'ok');
      else show('kid not found in the JWKS set.', 'err');
    } catch (e) {
      show(e.message || 'Failed to fetch or parse JWKS.', 'err');
    }
  }

  input.addEventListener('input', updateView);
  document.getElementById('verify').addEventListener('click', verifyKid);
  document.getElementById('clear').addEventListener('click', function () {
    input.value = '';
    jwksUrl.value = '';
    updateView();
  });
  document.getElementById('dl-header').addEventListener('click', function () { download('header'); });
  document.getElementById('dl-payload').addEventListener('click', function () { download('payload'); });
})();
</script>
</body>
</html>
