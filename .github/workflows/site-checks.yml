name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate catalogs, tool paths, and HTML
        run: node scripts/site-check.mjs
