<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Order | RMKR Toolkit</title>
  <meta name="description" content="Tap numbers 1–9 in order on a shuffled 3×3 grid. Best time saved locally.">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js" defer></script>
</head>
<body data-root="../../" data-tool="order">
<main class="wrap page-main" id="main">
  <a class="game-back" href="../">← Focus Games</a>
  <h1 class="page-title">Tap Order</h1>
  <p class="page-lead">Numbers 1–9 are mixed on a 3×3 grid. Tap them in ascending order. Timer starts on your first tap.</p>

  <div class="game-hud">
    <div class="game-hud-stats">
      <span>Time: <strong id="time">—</strong></span>
      <span>Best: <strong id="best">—</strong></span>
      <span>Next: <strong id="next">1</strong></span>
    </div>
    <div class="game-hud-actions">
      <button type="button" class="btn btn-gold" id="startBtn">Shuffle</button>
    </div>
  </div>
  <p class="game-note" id="note" role="status">Press Shuffle, then tap 1 through 9 in order.</p>
  <div class="game-board-wrap">
    <div class="order-grid" id="grid" aria-label="Tap order board"></div>
  </div>
</main>
<script>
(function () {
  var KEY = "rmkr-game-order-best";
  var SIZE = 9;
  var next = 1;
  var startedAt = 0;
  var ticking = null;
  var busy = false;
  var grid = document.getElementById("grid");
  var startBtn = document.getElementById("startBtn");

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(KEY) || "", 10);
      return Number.isFinite(v) && v > 0 ? v : null;
    } catch (e) { return null; }
  }
  function saveBest(n) {
    var cur = loadBest();
    if (cur == null || n < cur) {
      try { localStorage.setItem(KEY, String(n)); } catch (e) {}
      return n;
    }
    return cur;
  }
  function fmt(ms) {
    return (ms / 1000).toFixed(2) + " s";
  }
  function setNote(msg, kind) {
    var el = document.getElementById("note");
    el.textContent = msg || "";
    el.className = "game-note" + (kind ? " " + kind : "");
  }
  function renderBest() {
    var b = loadBest();
    document.getElementById("best").textContent = b == null ? "—" : fmt(b);
  }
  function stopTick() {
    if (ticking) {
      clearInterval(ticking);
      ticking = null;
    }
  }
  function startTick() {
    stopTick();
    ticking = setInterval(function () {
      document.getElementById("time").textContent = fmt(Math.round(performance.now() - startedAt));
    }, 50);
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }
  function buildBoard() {
    stopTick();
    busy = false;
    next = 1;
    startedAt = 0;
    document.getElementById("next").textContent = "1";
    document.getElementById("time").textContent = "—";
    setNote("Tap 1 to start the timer.");
    startBtn.textContent = "Shuffle";
    grid.innerHTML = "";
    var nums = [];
    for (var i = 1; i <= SIZE; i++) nums.push(i);
    // Avoid an already-sorted board
    do { shuffle(nums); } while (nums.every(function (n, idx) { return n === idx + 1; }));
    nums.forEach(function (n) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "order-cell";
      btn.textContent = String(n);
      btn.setAttribute("data-n", String(n));
      btn.setAttribute("aria-label", "Number " + n);
      btn.addEventListener("click", onTap);
      grid.appendChild(btn);
    });
    renderBest();
  }
  function finish(ms) {
    stopTick();
    busy = true;
    document.getElementById("time").textContent = fmt(ms);
    var best = saveBest(ms);
    renderBest();
    setNote("Done in " + fmt(ms) + ". Best: " + fmt(best) + ".", "ok");
    startBtn.textContent = "Play again";
  }
  function onTap(ev) {
    if (busy) return;
    var btn = ev.currentTarget;
    if (btn.classList.contains("is-done")) return;
    var n = parseInt(btn.getAttribute("data-n"), 10);
    if (n !== next) {
      btn.classList.add("is-miss");
      setNote("Need " + next + " next.", "err");
      setTimeout(function () { btn.classList.remove("is-miss"); }, 220);
      return;
    }
    if (!startedAt) {
      startedAt = performance.now();
      startTick();
    }
    btn.classList.add("is-done");
    btn.disabled = true;
    next += 1;
    if (next > SIZE) {
      document.getElementById("next").textContent = "—";
      finish(Math.max(1, Math.round(performance.now() - startedAt)));
      return;
    }
    document.getElementById("next").textContent = String(next);
    setNote("Good — now " + next + ".");
  }
  startBtn.addEventListener("click", buildBoard);
  buildBoard();
})();
</script>
</body>
</html>
