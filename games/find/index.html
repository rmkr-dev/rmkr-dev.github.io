<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Number | RMKR Toolkit</title>
  <meta name="description" content="Find the target number in a 4×4 grid. Best streak saved locally.">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js" defer></script>
</head>
<body data-root="../../" data-tool="find">
<main class="wrap page-main" id="main">
  <a class="game-back" href="../">← Focus Games</a>
  <h1 class="page-title">Find Number</h1>
  <p class="page-lead">A target from 1–99 is shown. Sixteen different numbers fill a 4×4 grid, and exactly one matches. Tap the <strong>matching</strong> cell. Keep a streak going.</p>

  <div class="game-hud">
    <div class="game-hud-stats">
      <span>Streak: <strong id="streak">0</strong></span>
      <span>Best: <strong id="best">—</strong></span>
    </div>
    <div class="game-hud-actions">
      <button type="button" class="btn btn-gold" id="startBtn">Start</button>
    </div>
  </div>
  <p class="game-note" id="note" role="status">Press Start, then tap the matching number.</p>
  <div class="game-board-wrap">
    <div class="find-stage" id="stage" aria-live="polite" aria-label="Find Number board">
      <p class="find-target" id="target" hidden>—</p>
      <div class="find-grid" id="grid" hidden aria-label="Number grid"></div>
    </div>
  </div>
</main>
<script>
(function () {
  var KEY = "rmkr-game-find-best";
  var streak = 0;
  var busy = false;
  var playing = false;
  var roundId = 0;
  var target = null;
  var targetEl = document.getElementById("target");
  var gridEl = document.getElementById("grid");
  var startBtn = document.getElementById("startBtn");

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(KEY) || "", 10);
      return Number.isFinite(v) && v > 0 ? v : null;
    } catch (e) { return null; }
  }
  function saveBest(n) {
    var cur = loadBest();
    if (cur == null || n > cur) {
      try { localStorage.setItem(KEY, String(n)); } catch (e) {}
      return n;
    }
    return cur;
  }
  function setNote(msg, kind) {
    var el = document.getElementById("note");
    el.textContent = msg || "";
    el.className = "game-note" + (kind ? " " + kind : "");
  }
  function renderBest() {
    var b = loadBest();
    document.getElementById("best").textContent = b == null ? "—" : String(b);
  }
  function renderStreak() {
    document.getElementById("streak").textContent = String(streak);
  }
  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }
  function makeRound() {
    var goal = randInt(1, 99);
    var used = {};
    used[goal] = true;
    var cells = [goal];
    while (cells.length < 16) {
      var n = randInt(1, 99);
      if (used[n]) continue;
      used[n] = true;
      cells.push(n);
    }
    return { target: goal, cells: shuffle(cells) };
  }
  function setCellsEnabled(on) {
    var buttons = gridEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = !on;
  }
  function showBoard() {
    targetEl.hidden = false;
    gridEl.hidden = false;
  }
  function renderRound(round) {
    target = round.target;
    targetEl.textContent = String(round.target);
    targetEl.classList.remove("ok", "err");
    gridEl.innerHTML = "";
    round.cells.forEach(function (n) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "find-cell";
      btn.textContent = String(n);
      btn.setAttribute("aria-label", "Number " + n);
      btn.addEventListener("click", function () { onPick(n, btn); });
      gridEl.appendChild(btn);
    });
  }
  function onPick(picked, btn) {
    if (!playing || busy || target == null) return;
    busy = true;
    setCellsEnabled(false);
    var id = roundId;
    var correct = picked === target;
    if (correct) {
      streak += 1;
      renderStreak();
      var best = saveBest(streak);
      renderBest();
      targetEl.classList.add("ok");
      btn.classList.add("is-correct");
      setNote(
        "Correct — " + picked + ". Streak " + streak +
          (best === streak ? " — new best!" : "."),
        "ok"
      );
      setTimeout(function () {
        if (!playing || id !== roundId) return;
        var next = makeRound();
        renderRound(next);
        setNote("Tap " + next.target + ".");
        busy = false;
      }, 450);
      return;
    }
    targetEl.classList.add("err");
    btn.classList.add("is-miss");
    var buttons = gridEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      if (Number(buttons[i].textContent) === target) {
        buttons[i].classList.add("is-correct");
      }
    }
    var ended = streak;
    streak = 0;
    renderStreak();
    setNote(
      "Wrong — " + target + " was the match" +
        (ended > 0 ? ". Streak reset from " + ended + "." : ". Press Start."),
      "err"
    );
    startBtn.textContent = "Play again";
    playing = false;
    busy = false;
  }
  function startGame() {
    roundId += 1;
    playing = true;
    busy = false;
    streak = 0;
    renderStreak();
    renderBest();
    startBtn.textContent = "Restart";
    showBoard();
    var round = makeRound();
    renderRound(round);
    setNote("Tap " + round.target + ".");
  }
  startBtn.addEventListener("click", startGame);
  renderBest();
  renderStreak();
})();
</script>
</body>
</html>
