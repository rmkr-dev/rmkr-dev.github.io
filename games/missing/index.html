<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missing Number | RMKR Toolkit</title>
  <meta name="description" content="Spot the blank in a short number sequence and tap the missing value. Best streak saved locally.">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js" defer></script>
</head>
<body data-root="../../" data-tool="missing">
<main class="wrap page-main" id="main">
  <a class="game-back" href="../">← Focus Games</a>
  <h1 class="page-title">Missing Number</h1>
  <p class="page-lead">A short ascending sequence shows four slots with one blank. Tap the <strong>missing</strong> number from four choices. Keep a streak going.</p>

  <div class="game-hud">
    <div class="game-hud-stats">
      <span>Streak: <strong id="streak">0</strong></span>
      <span>Best: <strong id="best">—</strong></span>
    </div>
    <div class="game-hud-actions">
      <button type="button" class="btn btn-gold" id="startBtn">Start</button>
    </div>
  </div>
  <p class="game-note" id="note" role="status">Press Start, then tap the missing number.</p>
  <div class="game-board-wrap">
    <div class="missing-stage" id="stage" aria-live="polite" aria-label="Missing Number board">
      <div class="missing-seq" id="seq" hidden aria-label="Number sequence"></div>
      <div class="missing-choices" id="choices" hidden aria-label="Answer choices"></div>
    </div>
  </div>
</main>
<script>
(function () {
  var KEY = "rmkr-game-missing-best";
  var streak = 0;
  var busy = false;
  var playing = false;
  var answer = null;
  var seqEl = document.getElementById("seq");
  var choicesEl = document.getElementById("choices");
  var startBtn = document.getElementById("startBtn");

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(KEY) || "", 10);
      return Number.isFinite(v) && v > 0 ? v : null;
    } catch (e) { return null; }
  }
  function saveBest(n) {
    var cur = loadBest();
    if (cur == null || n > cur) {
      try { localStorage.setItem(KEY, String(n)); } catch (e) {}
      return n;
    }
    return cur;
  }
  function setNote(msg, kind) {
    var el = document.getElementById("note");
    el.textContent = msg || "";
    el.className = "game-note" + (kind ? " " + kind : "");
  }
  function renderBest() {
    var b = loadBest();
    document.getElementById("best").textContent = b == null ? "—" : String(b);
  }
  function renderStreak() {
    document.getElementById("streak").textContent = String(streak);
  }
  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }
  function makeRound() {
    var step = [1, 2, 3][randInt(0, 2)];
    var maxStart = Math.max(1, 30 - step * 3);
    var start = randInt(1, maxStart);
    var values = [start, start + step, start + step * 2, start + step * 3];
    var blankAt = randInt(0, 3);
    var ans = values[blankAt];
    var wrongs = {};
    var tries = 0;
    while (Object.keys(wrongs).length < 3 && tries < 50) {
      tries += 1;
      var delta = randInt(1, 4);
      var sign = Math.random() < 0.5 ? -1 : 1;
      var w = ans + sign * delta;
      if (w === ans || w < 1 || w > 30 || wrongs[w]) continue;
      // Avoid accidentally matching another slot in the sequence
      if (values.indexOf(w) !== -1 && w !== ans) continue;
      wrongs[w] = true;
    }
    while (Object.keys(wrongs).length < 3) {
      var fill = ans + Object.keys(wrongs).length + 1;
      if (fill !== ans && fill >= 1 && fill <= 30 && !wrongs[fill] && values.indexOf(fill) === -1) {
        wrongs[fill] = true;
      } else {
        var alt = ans - (Object.keys(wrongs).length + 1);
        if (alt !== ans && alt >= 1 && !wrongs[alt] && values.indexOf(alt) === -1) wrongs[alt] = true;
        else wrongs[ans + 5 + Object.keys(wrongs).length] = true;
      }
    }
    var choices = shuffle([ans].concat(Object.keys(wrongs).map(Number)));
    return { values: values, blankAt: blankAt, answer: ans, choices: choices };
  }
  function setChoicesEnabled(on) {
    var buttons = choicesEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = !on;
  }
  function showBoard() {
    seqEl.hidden = false;
    choicesEl.hidden = false;
  }
  function renderRound(round) {
    answer = round.answer;
    seqEl.innerHTML = "";
    seqEl.classList.remove("ok", "err");
    for (var i = 0; i < round.values.length; i++) {
      var slot = document.createElement("span");
      slot.className = "missing-slot" + (i === round.blankAt ? " is-blank" : "");
      if (i === round.blankAt) {
        slot.textContent = "?";
        slot.setAttribute("aria-label", "Missing number");
      } else {
        slot.textContent = String(round.values[i]);
        slot.setAttribute("aria-label", "Number " + round.values[i]);
      }
      seqEl.appendChild(slot);
    }
    choicesEl.innerHTML = "";
    round.choices.forEach(function (n) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn missing-choice";
      btn.textContent = String(n);
      btn.setAttribute("aria-label", "Answer " + n);
      btn.addEventListener("click", function () { onPick(n, btn); });
      choicesEl.appendChild(btn);
    });
  }
  function onPick(picked, btn) {
    if (!playing || busy || answer == null) return;
    busy = true;
    setChoicesEnabled(false);
    var correct = picked === answer;
    if (correct) {
      streak += 1;
      renderStreak();
      var best = saveBest(streak);
      renderBest();
      seqEl.classList.add("ok");
      btn.classList.add("is-correct");
      var blank = seqEl.querySelector(".is-blank");
      if (blank) blank.textContent = String(answer);
      setNote(
        "Correct — missing was " + answer +
          ". Streak " + streak + (best === streak ? " — new best!" : "."),
        "ok"
      );
      setTimeout(function () {
        if (!playing) return;
        var next = makeRound();
        renderRound(next);
        setNote("Which number is missing?");
        busy = false;
      }, 500);
      return;
    }
    seqEl.classList.add("err");
    btn.classList.add("is-miss");
    var buttons = choicesEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      if (Number(buttons[i].textContent) === answer) {
        buttons[i].classList.add("is-correct");
      }
    }
    var blankMiss = seqEl.querySelector(".is-blank");
    if (blankMiss) blankMiss.textContent = String(answer);
    var ended = streak;
    streak = 0;
    renderStreak();
    setNote(
      "Wrong — missing was " + answer +
        (ended > 0 ? ". Streak reset from " + ended + "." : ". Press Start."),
      "err"
    );
    startBtn.textContent = "Play again";
    playing = false;
    busy = false;
  }
  function startGame() {
    playing = true;
    busy = false;
    streak = 0;
    renderStreak();
    renderBest();
    startBtn.textContent = "Restart";
    showBoard();
    var round = makeRound();
    renderRound(round);
    setNote("Which number is missing?");
  }
  startBtn.addEventListener("click", startGame);
  renderBest();
  renderStreak();
})();
</script>
</body>
</html>
