<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Clash | RMKR Toolkit</title>
  <meta name="description" content="Stroop-style focus: tap the ink color, not the word. Best streak saved locally.">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/site.js" defer></script>
</head>
<body data-root="../../" data-tool="colors">
<main class="wrap page-main" id="main">
  <a class="game-back" href="../">← Focus Games</a>
  <h1 class="page-title">Color Clash</h1>
  <p class="page-lead">A color word appears in a different ink. Tap the <strong>ink color</strong>, not what the word says. Keep a streak going.</p>

  <div class="game-hud">
    <div class="game-hud-stats">
      <span>Streak: <strong id="streak">0</strong></span>
      <span>Best: <strong id="best">—</strong></span>
    </div>
    <div class="game-hud-actions">
      <button type="button" class="btn btn-gold" id="startBtn">Start</button>
    </div>
  </div>
  <p class="game-note" id="note" role="status">Press Start, then tap the ink color.</p>
  <div class="game-board-wrap">
    <div class="colors-stage" id="stage" aria-live="polite">
      <p class="colors-word" id="word" hidden>—</p>
      <div class="colors-choices" id="choices" aria-label="Ink color choices"></div>
    </div>
  </div>
</main>
<script>
(function () {
  var KEY = "rmkr-game-colors-best";
  var COLORS = [
    { id: "red", name: "Red", hex: "#f87171" },
    { id: "blue", name: "Blue", hex: "#60a5fa" },
    { id: "green", name: "Green", hex: "#4ade80" },
    { id: "gold", name: "Gold", hex: "#ffc300" },
    { id: "violet", name: "Violet", hex: "#c084fc" }
  ];
  var streak = 0;
  var busy = false;
  var playing = false;
  var inkId = null;
  var wordEl = document.getElementById("word");
  var choicesEl = document.getElementById("choices");
  var startBtn = document.getElementById("startBtn");

  function loadBest() {
    try {
      var v = parseInt(localStorage.getItem(KEY) || "", 10);
      return Number.isFinite(v) && v > 0 ? v : null;
    } catch (e) { return null; }
  }
  function saveBest(n) {
    var cur = loadBest();
    if (cur == null || n > cur) {
      try { localStorage.setItem(KEY, String(n)); } catch (e) {}
      return n;
    }
    return cur;
  }
  function setNote(msg, kind) {
    var el = document.getElementById("note");
    el.textContent = msg || "";
    el.className = "game-note" + (kind ? " " + kind : "");
  }
  function renderBest() {
    var b = loadBest();
    document.getElementById("best").textContent = b == null ? "—" : String(b);
  }
  function renderStreak() {
    document.getElementById("streak").textContent = String(streak);
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }
  function pickClash() {
    var wordColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    var inkColor;
    do {
      inkColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    } while (inkColor.id === wordColor.id);
    var pool = COLORS.filter(function (c) { return c.id !== inkColor.id; });
    shuffle(pool);
    var choices = [inkColor].concat(pool.slice(0, 3));
    shuffle(choices);
    return { word: wordColor, ink: inkColor, choices: choices };
  }
  function clearChoices() {
    choicesEl.innerHTML = "";
  }
  function nextRound() {
    busy = false;
    var round = pickClash();
    inkId = round.ink.id;
    wordEl.hidden = false;
    wordEl.textContent = round.word.name.toUpperCase();
    wordEl.style.color = round.ink.hex;
    wordEl.setAttribute("aria-label", "Color word painted in " + round.ink.name);
    clearChoices();
    round.choices.forEach(function (c) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "colors-choice";
      btn.setAttribute("data-id", c.id);
      btn.setAttribute("aria-label", c.name);
      btn.innerHTML = '<span class="colors-swatch" style="background:' + c.hex + '"></span><span class="colors-label">' + c.name + "</span>";
      btn.addEventListener("click", onPick);
      choicesEl.appendChild(btn);
    });
    setNote("Tap the ink color — ignore the word.");
  }
  function onPick(ev) {
    if (!playing || busy) return;
    var btn = ev.currentTarget;
    var id = btn.getAttribute("data-id");
    busy = true;
    if (id === inkId) {
      btn.classList.add("is-correct");
      streak += 1;
      renderStreak();
      var best = saveBest(streak);
      renderBest();
      setNote("Correct. Streak " + streak + (best === streak ? " — new best!" : ".") , "ok");
      setTimeout(function () {
        if (playing) nextRound();
      }, 420);
      return;
    }
    btn.classList.add("is-miss");
    var buttons = choicesEl.querySelectorAll(".colors-choice");
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute("data-id") === inkId) {
        buttons[i].classList.add("is-correct");
      }
      buttons[i].disabled = true;
    }
    var ended = streak;
    streak = 0;
    renderStreak();
    setNote(
      ended > 0
        ? "Miss — ink was " + (COLORS.find(function (c) { return c.id === inkId; }) || {}).name + ". Streak reset from " + ended + "."
        : "Miss — ink was " + (COLORS.find(function (c) { return c.id === inkId; }) || {}).name + ". Try again.",
      "err"
    );
    startBtn.textContent = "Play again";
    playing = false;
    busy = false;
  }
  function startGame() {
    playing = true;
    streak = 0;
    renderStreak();
    renderBest();
    startBtn.textContent = "Restart";
    nextRound();
  }
  startBtn.addEventListener("click", startGame);
  renderBest();
  renderStreak();
  clearChoices();
  wordEl.hidden = true;
})();
</script>
</body>
</html>
